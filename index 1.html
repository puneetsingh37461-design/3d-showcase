<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D Product Showcase</title>
<!-- Google's <model-viewer> web component: renders .glb 3D models -->
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { font-family: Arial, sans-serif; background: #f8f9fa; color: #202124; padding: 16px; }
  h1 { font-size: 1.6rem; } .sub { color: #5f6368; margin: 4px 0 16px; }
  .layout { display: flex; flex-direction: column; gap: 16px; max-width: 1000px; margin: auto; }
  model-viewer { width: 100%; height: 55vh; background: #e8f0fe; border-radius: 16px; }
  .panel { background: #fff; border-radius: 16px; padding: 16px; box-shadow: 0 1px 4px #0002; }
  .btns { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
  button { border: 2px solid #4285f4; background: #fff; color: #4285f4; padding: 8px 14px;
           border-radius: 20px; cursor: pointer; font-weight: bold; transition: .2s; }
  button:hover, button.active { background: #4285f4; color: #fff; }
  #info { animation: fade .5s; }               /* animation 1: info text fades in */
  @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  #msg { color: #ea4335; margin-top: 8px; }
  @media (min-width: 800px) {                 /* responsive: side by side on desktop */
    .layout { flex-direction: row; } model-viewer { flex: 2; height: 70vh; } .panel { flex: 1; }
  }
</style>
</head>
<body>
<h1>Astro Explorer Suit</h1>
<p class="sub">Drag to rotate, scroll or pinch to zoom.</p>
<div class="layout">
  <!-- camera-controls = rotate/zoom; auto-rotate = animation 2 -->
  <model-viewer id="v" alt="3D astronaut model" camera-controls auto-rotate shadow-intensity="1"></model-viewer>
  <div class="panel">
    <h2>Explore</h2>
    <div class="btns">
      <button data-view="front" class="active">Front</button>
      <button data-view="back">Back</button>
      <button data-view="close">Close-up</button>
    </div>
    <button id="spin">Pause rotation</button>
    <div id="info" style="margin-top:16px"><h3 id="t"></h3><p id="d"></p></div>
    <p id="msg"></p>
  </div>
</div>
<script>
  const MODEL_URL = "https://modelviewer.dev/shared-assets/models/Astronaut.glb"; // change to use another .glb
  const v = document.getElementById("v");
  v.src = MODEL_URL;

  // Each button = camera angle + text. Edit the text to make it yours.
  const views = {
    front: { orbit: "0deg 80deg auto",   title: "Front view",  text: "Add your first product detail here." },
    back:  { orbit: "180deg 80deg auto", title: "Back view",   text: "Add your second product detail here." },
    close: { orbit: "20deg 70deg 50%",   title: "Close-up",    text: "Zoom in to see the fine details." }
  };

  function show(name) {
    const view = views[name];
    v.cameraOrbit = view.orbit;                     // model-viewer smoothly animates the camera
    document.getElementById("t").textContent = view.title;
    document.getElementById("d").textContent = view.text;
    const info = document.getElementById("info");   // restart the fade-in animation
    info.style.animation = "none"; info.offsetHeight; info.style.animation = "";
    document.querySelectorAll("[data-view]").forEach(b => b.classList.toggle("active", b.dataset.view === name));
  }
  document.querySelectorAll("[data-view]").forEach(b => b.addEventListener("click", () => show(b.dataset.view)));

  document.getElementById("spin").addEventListener("click", e => {
    v.autoRotate = !v.autoRotate;
    e.target.textContent = v.autoRotate ? "Pause rotation" : "Start rotation";
  });

  v.addEventListener("error", () => {
    document.getElementById("msg").textContent = "Model could not load. Check your internet or MODEL_URL.";
  });
  show("front");
</script>
</body>
</html>
